[project]
name = "rednote-monitor"
version = "0.1.0"
description = "小红书股票情绪监控系统 — 对小红书上指定 ticker 的相关帖子进行多模态情绪打分"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "litellm>=1.0",  # kept for backward compat, M2 now uses httpx directly
    "sqlmodel>=0.0.14",
    "yfinance>=0.2.0",
    "akshare>=1.0.0",
    "streamlit>=1.0.0",
    "httpx>=0.25.0",
    "sqlalchemy>=2.0.49",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
