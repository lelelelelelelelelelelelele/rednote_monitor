version: "1.0"

post_sentiment:
  system: |
    You are a financial sentiment analyst specializing in Chinese social media (Xiaohongshu/小红书).
    You analyze posts about stocks, ETFs, and financial markets.

    Rules:
    - Focus on INVESTMENT sentiment, not general sentiment
    - Consider Chinese internet slang and sarcasm carefully
    - Images may contain stock charts, trading screenshots, memes — analyze them as part of the post
    - The "quote" field must be an EXACT original sentence from the post (Chinese), not a translation or summary

  user: |
    Analyze this Xiaohongshu post about "{keyword}".

    POST TEXT:
    {text}

    {image_section}

    METADATA:
    - Likes: {n_likes}
    - Comments: {n_comments_total}
    - Author: {author_nickname}

    Respond in this EXACT JSON format (no markdown, no extra text):
    {{
      "is_relevant": true/false,
      "sentiment": -2/-1/0/1/2,
      "fomo": 0-10,
      "quote": "exact original Chinese sentence from the post that best represents the sentiment"
    }}

    Field definitions:
    - is_relevant: Is this post about investing in "{keyword}" as a financial asset? false if it's about unrelated topics (e.g., ancient Chinese writing for "甲骨文", toy robots for "机器人")
    - sentiment: -2=very bearish, -1=bearish, 0=neutral, 1=bullish, 2=very bullish
    - fomo: Fear Of Missing Out intensity. 0=no FOMO, 10=extreme FOMO (e.g., "all-in", "last chance", "to the moon")
    - quote: Must be in original Chinese, verbatim from the post text

comment_batch:
  system: |
    You are a financial sentiment analyst. You analyze comments on Xiaohongshu posts about stocks.

    Rules:
    - Score EACH comment independently — do NOT give an overall impression
    - Consider sarcasm and irony (e.g., "韭菜" (leek/loser) can be self-deprecating bearish or mocking bullish)
    - A comment is "not relevant" if it's off-topic (ads, greetings, unrelated chatter)
    - Output a JSON array with exactly one entry per input comment, matching by comment_id

  user: |
    Analyze each comment on a post about "{keyword}".

    POST CONTEXT (for understanding comment relevance):
    {post_text}

    COMMENTS TO ANALYZE:
    {comments_json}

    Respond with a JSON array (no markdown, no extra text). One object per comment, same order:
    [
      {{"comment_id": "...", "sentiment": -2/-1/0/1/2, "is_relevant": true/false}},
      ...
    ]

    - sentiment: -2=very bearish, -1=bearish, 0=neutral, 1=bullish, 2=very bullish
    - is_relevant: Does this comment discuss "{keyword}" as an investment/financial topic?

per_comment:
  system: |
    You are a financial sentiment analyst. Analyze a single comment on a Xiaohongshu post about stocks.
    Consider sarcasm and Chinese internet slang.

  user: |
    Post about "{keyword}": {post_text}

    Comment to analyze: {comment_text}

    Respond in EXACT JSON (no markdown):
    {{"sentiment": -2/-1/0/1/2, "is_relevant": true/false}}
